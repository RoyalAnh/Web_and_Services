<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#143d59">
  <title>Quản lý Người dùng &amp; Phân quyền RBAC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      font-family: "Be Vietnam Pro", system-ui, sans-serif;
      color: #1f2933;
      background: #f3f6f9;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --navy: #143d59;
      --blue: #1677a8;
      --border: #d9e1e8;
      --muted: #647482;
      --red: #b42318;
      --green: #18794e;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    button, input, select, textarea { font: inherit; }
    button {
      min-height: 40px;
      padding: 8px 13px;
      border: 1px solid #c6d2dc;
      border-radius: 7px;
      color: #243746;
      background: #fff;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover:not(:disabled) { border-color: var(--blue); color: var(--blue); }
    button:disabled { cursor: not-allowed; opacity: .48; }
    button.primary { border-color: var(--blue); color: #fff; background: var(--blue); }
    button.primary:hover:not(:disabled) { background: #105f88; color: #fff; }
    button.danger { border-color: #f1c2bd; color: var(--red); }
    button.danger:hover:not(:disabled) { background: #fff1f0; }
    input, select, textarea {
      width: 100%;
      min-height: 42px;
      padding: 9px 11px;
      border: 1px solid #c6d2dc;
      border-radius: 7px;
      color: #243746;
      background: #fff;
    }
    input:focus, select:focus, textarea:focus {
      outline: 3px solid #1677a826;
      border-color: var(--blue);
    }
    label { display: block; margin: 12px 0 5px; font-size: 14px; font-weight: 600; }
    .app { width: min(1240px, 100% - 36px); margin: 28px auto; }
    .header {
      display: flex; justify-content: space-between; align-items: center; gap: 16px;
      padding: 21px 24px; border-radius: 12px 12px 0 0; color: #fff; background: var(--navy);
    }
    .header h1 { margin: 0 0 7px; font-size: 22px; }
    .header .muted { color: #c6dce9; }
    .header button { flex: 0 0 auto; }
    .muted { color: var(--muted); font-size: 13px; }
    .tabs {
      display: flex; gap: 5px; padding: 10px 18px 0;
      border-bottom: 1px solid var(--border); background: #fff;
    }
    .tabs button { min-height: 46px; border: 0; border-radius: 7px 7px 0 0; background: transparent; }
    .tabs button.active { color: var(--blue); box-shadow: inset 0 -3px var(--blue); }
    .panel {
      min-height: 430px; padding: 22px; border-radius: 0 0 12px 12px;
      background: #fff; box-shadow: 0 8px 25px #1c344412;
    }
    .toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; margin-bottom: 16px; }
    .toolbar .search { flex: 1 1 260px; }
    .toolbar select { width: auto; min-width: 130px; }
    .table-wrap { width: 100%; overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 12px 10px; border-bottom: 1px solid #e9eef2; text-align: left; vertical-align: middle; }
    th { color: #435563; background: #f7f9fb; white-space: nowrap; }
    tr:last-child td { border-bottom: 0; }
    td.actions { min-width: 220px; white-space: nowrap; }
    td.actions button { min-height: 34px; margin: 2px; padding: 5px 8px; font-size: 12px; }
    .badge {
      display: inline-flex; align-items: center; margin: 2px; padding: 3px 8px;
      border-radius: 99px; color: #185b82; background: #e7f3fa; font-size: 11px; white-space: nowrap;
    }
    .badge.locked { color: #9a3412; background: #fff0e6; }
    .badge.active { color: #17603c; background: #e7f7ef; }
    .badge.system { color: #7c4a03; background: #fff3d8; }
    .pagination { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 9px; margin-top: 15px; }
    .pagination select { width: 78px; min-width: 78px; }
    .empty, .loading { padding: 42px 12px; text-align: center; color: var(--muted); }
    .profile-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .profile-item { padding: 14px; border: 1px solid var(--border); border-radius: 8px; }
    .profile-item strong { display: block; margin-bottom: 5px; color: #445967; font-size: 12px; }
    .permission-list { display: flex; flex-wrap: wrap; gap: 5px; }
    .login-card { width: min(440px, 100%); margin: 9vh auto; padding: 28px; border: 1px solid var(--border); border-radius: 12px; background: #fff; box-shadow: 0 10px 30px #1c344412; }
    .login-card h1 { margin: 0 0 5px; color: var(--navy); font-size: 23px; }
    .login-card button { width: 100%; margin-top: 18px; }
    .error { color: var(--red); font-size: 13px; }
    .field-error { display: block; min-height: 17px; color: var(--red); font-size: 12px; }
    .modal-backdrop { position: fixed; z-index: 10; inset: 0; display: grid; place-items: center; padding: 18px; background: #10202fb3; }
    .modal { width: min(460px, 100%); max-height: 92vh; overflow-y: auto; padding: 22px; border-radius: 11px; background: #fff; box-shadow: 0 20px 60px #0003; }
    .modal h2 { margin: 0 0 8px; color: var(--navy); font-size: 19px; }
    .modal-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
    .checks { max-height: 260px; overflow-y: auto; margin: 12px 0; padding: 10px; border: 1px solid var(--border); border-radius: 8px; }
    .check { display: flex; align-items: flex-start; gap: 9px; margin: 9px 0; font-weight: 400; }
    .check input { width: 18px; min-height: 18px; height: 18px; margin: 2px 0 0; }
    .resource-heading { margin: 13px 0 4px; color: var(--blue); font-size: 12px; font-weight: 700; text-transform: uppercase; }
    .toast { position: fixed; z-index: 20; right: 20px; bottom: 20px; max-width: min(420px, calc(100vw - 40px)); padding: 13px 17px; border-radius: 8px; color: #fff; box-shadow: 0 8px 24px #0002; }
    .toast.success { background: var(--green); }
    .toast.error { background: #a9271d; }
    .status-text { display: inline-block; min-width: 90px; }
    @media (max-width: 768px) {
      .app { width: min(100% - 20px, 600px); margin: 10px auto; }
      .header { align-items: flex-start; padding: 17px; }
      .header h1 { font-size: 18px; }
      .header button { min-width: 82px; }
      .panel { padding: 14px; }
      .tabs { overflow-x: auto; padding-inline: 8px; }
      .tabs button { flex: 0 0 auto; }
      .toolbar > * { flex: 1 1 145px; }
      .toolbar .search { flex-basis: 100%; }
      .toolbar select { width: 100%; }
      .profile-grid { grid-template-columns: 1fr; }
      .pagination { justify-content: center; }
      .modal { width: 95%; padding: 18px; }
      .modal button, .toolbar button, .header button { min-height: 44px; }
      table { min-width: 760px; font-size: 12px; }
      .login-card { margin: 6vh auto; padding: 22px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="./config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useCallback, useEffect, useMemo, useRef, useState } = React;
    const TOKEN_KEY = "rbac_token";
    const token = () => sessionStorage.getItem(TOKEN_KEY);
    const setToken = (value) => value ? sessionStorage.setItem(TOKEN_KEY, value) : sessionStorage.removeItem(TOKEN_KEY);
    const api = axios.create({ baseURL: window.RBAC_API_BASE, timeout: 10000 });

    api.interceptors.request.use((config) => {
      const value = token();
      if (value) config.headers.Authorization = `Bearer ${value}`;
      return config;
    });
    api.interceptors.response.use((response) => response, (error) => {
      if (!error.response) {
        return Promise.reject({
          status: 0, code: "NETWORK_ERROR", details: [],
          message: error.code === "ECONNABORTED"
            ? "Máy chủ phản hồi quá lâu."
            : "Không kết nối được máy chủ (kiểm tra server, mạng hoặc CORS).",
        });
      }
      const { status, data } = error.response;
      const normalized = {
        status,
        code: data?.error?.code || `HTTP_${status}`,
        message: data?.error?.message || `Lỗi ${status}`,
        details: data?.error?.details || [],
      };
      if (status === 401 && !error.config?.url?.endsWith("/auth/tokens")) {
        setToken(null);
        window.dispatchEvent(new Event("rbac:expired"));
      }
      if (status === 403) window.dispatchEvent(new Event("rbac:forbidden"));
      return Promise.reject(normalized);
    });
    const can = (me, permission) => !!me?.permissions?.includes(permission);
    const sameId = (a, b) => String(a) === String(b);
    const errorText = (error) => error?.message || "Không thể hoàn thành thao tác.";
    const codePermissions = (role) => role?.permissions || [];
    const hasEscalation = (role, me) => codePermissions(role).some((permission) => !me.permissions.includes(permission));

    function App() {
      const [me, setMe] = useState(null);
      const [checking, setChecking] = useState(!!token());
      const [tab, setTab] = useState("users");
      const [toast, setToast] = useState(null);
      const toastTimer = useRef(null);

      const notify = useCallback((type, message) => {
        setToast({ type, message });
        clearTimeout(toastTimer.current);
        toastTimer.current = setTimeout(() => setToast(null), 4000);
      }, []);
      const loadMe = useCallback(async () => {
        const response = await api.get("/me");
        setMe(response.data);
        return response.data;
      }, []);

      useEffect(() => {
        if (!token()) return;
        loadMe()
          .catch((error) => {
            setToken(null);
            setMe(null);
            if (error.status !== 401) notify("error", errorText(error));
          })
          .finally(() => setChecking(false));
      }, [loadMe, notify]);

      useEffect(() => {
        const onExpired = () => {
          setMe(null);
          setChecking(false);
          notify("error", "Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.");
        };
        const onForbidden = () => {
          if (token()) loadMe().catch((error) => notify("error", errorText(error)));
        };
        window.addEventListener("rbac:expired", onExpired);
        window.addEventListener("rbac:forbidden", onForbidden);
        return () => {
          window.removeEventListener("rbac:expired", onExpired);
          window.removeEventListener("rbac:forbidden", onForbidden);
          clearTimeout(toastTimer.current);
        };
      }, [loadMe, notify]);

      const logout = () => { setToken(null); setMe(null); setTab("users"); };
      const login = async (email, password) => {
        const response = await api.post("/auth/tokens", { grantType: "password", email, password });
        setToken(response.data.accessToken);
        try {
          await loadMe();
        } catch (error) {
          setToken(null);
          throw error;
        }
      };

      if (checking) return <div className="loading">Đang kiểm tra phiên đăng nhập…</div>;
      if (!me) return <LoginPage onLogin={login} />;

      const tabs = [
        can(me, "users:read") && { key: "users", label: "Người dùng" },
        can(me, "roles:read") && { key: "roles", label: "Vai trò" },
        { key: "profile", label: "Hồ sơ của tôi" },
      ].filter(Boolean);
      const current = tabs.some((item) => item.key === tab) ? tab : tabs[0].key;

      return <main className="app">
        <header className="header">
          <div>
            <h1>Quản lý Người dùng &amp; Phân quyền</h1>
            <div className="muted">{me.fullName} ({me.email}) · {me.roles.map((role) =>
              <span className="badge" key={role.id}>{role.name}</span>)}</div>
          </div>
          <button onClick={logout}>Đăng xuất</button>
        </header>
        <nav className="tabs" aria-label="Điều hướng chính">
          {tabs.map((item) => <button key={item.key} className={current === item.key ? "active" : ""}
            onClick={() => setTab(item.key)}>{item.label}</button>)}
        </nav>
        <section className="panel">
          {current === "users" && <UsersPage me={me} notify={notify} reloadMe={loadMe} />}
          {current === "roles" && <RolesPage me={me} notify={notify} reloadMe={loadMe} />}
          {current === "profile" && <MyProfile me={me} />}
        </section>
        {toast && <div role="status" className={`toast ${toast.type}`}>{toast.message}</div>}
      </main>;
    }

    function LoginPage({ onLogin }) {
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [error, setError] = useState("");
      const [saving, setSaving] = useState(false);
      const submit = async (event) => {
        event.preventDefault();
        setError("");
        if (!email.trim() || !password) {
          setError("Vui lòng nhập email và mật khẩu.");
          return;
        }
        setSaving(true);
        try {
          await onLogin(email.trim().toLowerCase(), password);
        } catch (failure) {
          setError(errorText(failure));
        } finally {
          setSaving(false);
        }
      };
      return <main className="login-card">
        <h1>Đăng nhập</h1>
        <p className="muted">Hệ thống quản lý người dùng và phân quyền.</p>
        <form onSubmit={submit}>
          <label htmlFor="login-email">Email</label>
          <input id="login-email" name="email" type="email" autoComplete="username"
            value={email} onChange={(event) => setEmail(event.target.value)} required />
          <label htmlFor="login-password">Mật khẩu</label>
          <input id="login-password" name="password" type="password" autoComplete="current-password"
            value={password} onChange={(event) => setPassword(event.target.value)} required />
          {error && <p className="error" role="alert">{error}</p>}
          <button className="primary" type="submit" disabled={saving}>{saving ? "Đang đăng nhập…" : "Đăng nhập"}</button>
        </form>
      </main>;
    }

    function useToastError(notify) {
      return useCallback((error) => {
        notify("error", errorText(error));
      }, [notify]);
    }

    function SearchInput({ onChange }) {
      const [value, setValue] = useState("");
      useEffect(() => {
        const timer = setTimeout(() => onChange(value), 400);
        return () => clearTimeout(timer);
      }, [value, onChange]);
      return <input className="search" placeholder="Tìm theo họ tên hoặc email (tối thiểu 2 ký tự)…"
        value={value} onChange={(event) => setValue(event.target.value)} aria-label="Tìm người dùng" />;
    }

    function UsersPage({ me, notify, reloadMe }) {
      const [users, setUsers] = useState([]);
      const [roles, setRoles] = useState([]);
      const [meta, setMeta] = useState({ page: 1, limit: 5, totalItems: 0, totalPages: 1 });
      const [page, setPage] = useState(1);
      const [limit, setLimit] = useState(5);
      const [search, setSearch] = useState("");
      const [status, setStatus] = useState("");
      const [roleId, setRoleId] = useState("");
      const [editor, setEditor] = useState(undefined);
      const [assigning, setAssigning] = useState(null);
      const [loading, setLoading] = useState(false);
      const handleError = useToastError(notify);
      const fetchUsers = useCallback(async () => {
        setLoading(true);
        const params = { page, limit, sort: "-createdAt" };
        if (search.trim().length >= 2) params.q = search.trim();
        if (status) params.status = status;
        if (roleId) params.roleId = roleId;
        try {
          const { data } = await api.get("/users", { params });
          setUsers(data.data);
          setMeta(data.meta);
          if (page > data.meta.totalPages) setPage(data.meta.totalPages);
        } catch (error) {
          await handleError(error);
        } finally {
          setLoading(false);
        }
      }, [page, limit, search, status, roleId, handleError]);

      useEffect(() => { fetchUsers(); }, [fetchUsers]);
      useEffect(() => {
        if (!can(me, "roles:read")) return;
        let active = true;
        const loadRoles = async () => {
          try {
            const response = await api.get("/roles", { params: { page: 1, limit: 100, sort: "name" } });
            if (active) setRoles(response.data.data);
          } catch (error) {
            handleError(error);
          }
        };
        loadRoles();
        return () => { active = false; };
      }, [me, handleError]);
      const updateFilter = (setter) => (value) => { setter(value); setPage(1); };
      const changeSearch = useCallback((value) => { setSearch(value); setPage(1); }, []);
      const toggleLock = async (user) => {
        try {
          await api.patch(`/users/${user.id}`, { status: user.status === "locked" ? "active" : "locked" });
          notify("success", "Đã cập nhật trạng thái người dùng.");
          await fetchUsers();
        } catch (error) { await handleError(error); }
      };
      const removeUser = async (user) => {
        if (!window.confirm(`Bạn có chắc muốn xóa "${user.fullName}"?`)) return;
        try {
          await api.delete(`/users/${user.id}`);
          notify("success", "Đã xóa người dùng.");
          await fetchUsers();
        } catch (error) { await handleError(error); }
      };

      return <div>
        <h2>Người dùng</h2>
        <div className="toolbar">
          <SearchInput onChange={changeSearch} />
          <select aria-label="Lọc theo trạng thái" value={status}
            onChange={(event) => updateFilter(setStatus)(event.target.value)}>
            <option value="">Mọi trạng thái</option><option value="active">Hoạt động</option><option value="locked">Đã khóa</option>
          </select>
          {can(me, "roles:read") && <select aria-label="Lọc theo vai trò" value={roleId}
            onChange={(event) => updateFilter(setRoleId)(event.target.value)}>
            <option value="">Mọi vai trò</option>{roles.map((role) => <option key={role.id} value={role.id}>{role.name}</option>)}
          </select>}
          {can(me, "users:create") && <button className="primary" onClick={() => setEditor(null)}>+ Thêm người dùng</button>}
        </div>
        {loading ? <div className="loading">Đang tải người dùng…</div> : <div className="table-wrap">
          <table>
            <thead><tr><th>STT</th><th>Họ tên</th><th>Email</th><th>Vai trò</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
            <tbody>{users.length === 0 ? <tr><td className="empty" colSpan="6">Không có dữ liệu</td></tr> :
              users.map((user, index) => {
                const self = sameId(user.id, me.id);
                return <tr key={user.id}>
                  <td>{(meta.page - 1) * meta.limit + index + 1}</td>
                  <td>{user.fullName}{self ? " (bạn)" : ""}</td>
                  <td>{user.email}</td>
                  <td>{user.roles.map((role) => <span className="badge" key={role.id}>{role.name}</span>)}</td>
                  <td><span className={`badge ${user.status}`}>{user.status === "locked" ? "Đã khóa" : "Hoạt động"}</span></td>
                  <td className="actions">
                    {can(me, "users:update") && <button onClick={() => setEditor(user)}>Sửa</button>}
                    {can(me, "roles:assign") && can(me, "roles:read") && <button onClick={() => setAssigning(user)}>Vai trò</button>}
                    {can(me, "users:update") && <button disabled={self} onClick={() => toggleLock(user)}>
                      {user.status === "locked" ? "Mở khóa" : "Khóa"}</button>}
                    {can(me, "users:delete") && <button className="danger" disabled={self} onClick={() => removeUser(user)}>Xóa</button>}
                  </td>
                </tr>;
              })}
            </tbody>
          </table>
        </div>}
        <div className="pagination">
          <span className="muted">Tổng {meta.totalItems} người dùng ·</span>
          <label htmlFor="page-size">Hiển thị</label>
          <select id="page-size" value={limit} onChange={(event) => updateFilter(setLimit)(Number(event.target.value))}>
            {[5, 10, 20].map((size) => <option key={size} value={size}>{size}</option>)}
          </select>
          <button disabled={page <= 1} onClick={() => setPage((current) => current - 1)}>Trước</button>
          <span className="muted">Trang {meta.page} / {meta.totalPages}</span>
          <button disabled={page >= meta.totalPages} onClick={() => setPage((current) => current + 1)}>Sau</button>
        </div>
        {editor !== undefined && <UserModal user={editor} roles={roles} me={me} notify={notify}
          onClose={() => setEditor(undefined)} onSaved={async () => { setEditor(undefined); await fetchUsers(); }} />}
        {assigning && <RoleAssignModal user={assigning} roles={roles} me={me} notify={notify}
          onClose={() => setAssigning(null)} onSaved={async () => { setAssigning(null); await fetchUsers(); }} />}
      </div>;
    }

    function UserModal({ user, roles, me, notify, onClose, onSaved }) {
      const isNew = !user;
      const [form, setForm] = useState({
        email: user?.email || "", fullName: user?.fullName || "", phone: user?.phone || "",
        password: "",         roleIds: roles.filter((role) => role.code === "member").map((role) => role.id),
      });
      const [errors, setErrors] = useState({});
      const [saving, setSaving] = useState(false);
      const set = (field, value) => setForm((current) => ({ ...current, [field]: value }));
      const validate = () => {
        const next = {};
        if (!/^\S+@\S+\.\S+$/.test(form.email.trim())) next.email = "Email không hợp lệ.";
        if (form.fullName.trim().length < 2 || form.fullName.trim().length > 100) next.fullName = "Họ tên phải dài từ 2 đến 100 ký tự.";
        if (form.phone.trim() && !/^\+[1-9]\d{7,14}$/.test(form.phone.trim())) next.phone = "Dùng định dạng E.164, ví dụ +84912345678.";
        if (isNew && !/^(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/.test(form.password)) {
          next.password = "Mật khẩu cần 8 ký tự, chữ hoa, chữ số và ký tự đặc biệt.";
        }
        setErrors(next);
        return Object.keys(next).length === 0;
      };
      const submit = async (event) => {
        event.preventDefault();
        if (!validate()) return;
        setSaving(true);
        const clean = {
          email: form.email.trim().toLowerCase(), fullName: form.fullName.trim(),
          phone: form.phone.trim() || null,
        };
        try {
          if (isNew) {
            await api.post("/users", {
              ...clean, password: form.password,
              ...(can(me, "roles:assign") ? { roleIds: form.roleIds } : {}),
            });
          } else {
            const changed = Object.fromEntries(Object.entries(clean).filter(([key, value]) => value !== (user[key] ?? null)));
            if (Object.keys(changed).length) await api.patch(`/users/${user.id}`, changed);
          }
          notify("success", isNew ? "Tạo người dùng thành công." : "Cập nhật người dùng thành công.");
          await onSaved();
        } catch (error) {
          const fieldErrors = {};
          (error.details || []).forEach((item) => { if (item.field) fieldErrors[item.field] = item.message; });
          if (error.code === "EMAIL_ALREADY_EXISTS") fieldErrors.email = error.message;
          setErrors(fieldErrors);
          if (!Object.keys(fieldErrors).length) notify("error", errorText(error));
        } finally {
          setSaving(false);
        }
      };
      return <div className="modal-backdrop" onMouseDown={(event) => event.target === event.currentTarget && onClose()}>
        <section className="modal" role="dialog" aria-modal="true" aria-labelledby="user-modal-title">
          <h2 id="user-modal-title">{isNew ? "Thêm người dùng" : "Sửa người dùng"}</h2>
          <form onSubmit={submit}>
            <label>Email *</label><input type="email" value={form.email} onChange={(event) => set("email", event.target.value)} />
            <span className="field-error">{errors.email}</span>
            <label>Họ tên *</label><input value={form.fullName} onChange={(event) => set("fullName", event.target.value)} />
            <span className="field-error">{errors.fullName}</span>
            <label>Số điện thoại</label><input value={form.phone} placeholder="+84912345678" onChange={(event) => set("phone", event.target.value)} />
            <span className="field-error">{errors.phone}</span>
            {isNew && <><label>Mật khẩu *</label><input type="password" value={form.password} onChange={(event) => set("password", event.target.value)} />
              <span className="field-error">{errors.password}</span></>}
            {isNew && can(me, "roles:assign") && <div className="checks">
              <strong>Vai trò</strong>
              {roles.map((role) => {
                const disabled = hasEscalation(role, me);
                return <label className="check" key={role.id}>
                  <input type="checkbox" disabled={disabled} checked={form.roleIds.includes(role.id)}
                    onChange={(event) => set("roleIds", event.target.checked
                      ? [...form.roleIds, role.id] : form.roleIds.filter((id) => id !== role.id))} />
                  <span>{role.name} <span className="muted">({role.code})</span>
                    {disabled && <span className="muted"> — vượt quyền của bạn</span>}</span>
                </label>;
              })}
            </div>}
            <div className="modal-actions">
              <button className="primary" type="submit" disabled={saving}>{saving ? "Đang lưu…" : "Lưu"}</button>
              <button type="button" onClick={onClose}>Hủy</button>
            </div>
          </form>
        </section>
      </div>;
    }

    function RoleAssignModal({ user, roles, me, notify, onClose, onSaved }) {
      const initial = useMemo(() => user.roles.map((role) => String(role.id)), [user]);
      const [selected, setSelected] = useState(initial);
      const [saving, setSaving] = useState(false);
      const self = sameId(user.id, me.id);
      const toggle = (id) => setSelected((current) => current.includes(id)
        ? current.filter((value) => value !== id) : [...current, id]);
      const submit = async () => {
        const toAdd = selected.filter((id) => !initial.includes(id));
        const toRemove = initial.filter((id) => !selected.includes(id));
        const operations = [
          ...toAdd.map((id) => ({ id, action: "gán", run: () => api.put(`/users/${user.id}/roles/${id}`) })),
          ...toRemove.map((id) => ({ id, action: "gỡ", run: () => api.delete(`/users/${user.id}/roles/${id}`) })),
        ];
        if (!operations.length) { onClose(); return; }
        setSaving(true);
        const results = await Promise.allSettled(operations.map((operation) => operation.run()));
        const failed = results.flatMap((result, index) => result.status === "rejected"
          ? [`Không thể ${operations[index].action} "${roles.find((role) => sameId(role.id, operations[index].id))?.name}": ${errorText(result.reason)}`]
          : []);
        setSaving(false);
        notify(failed.length ? "error" : "success", failed.length ? failed.join(" ") : `Đã cập nhật vai trò cho ${user.fullName}.`);
        await onSaved();
      };
      return <div className="modal-backdrop" onMouseDown={(event) => event.target === event.currentTarget && onClose()}>
        <section className="modal" role="dialog" aria-modal="true" aria-labelledby="assign-title">
          <h2 id="assign-title">Vai trò của {user.fullName}</h2>
          <div className="checks">{roles.map((role) => {
            const missing = hasEscalation(role, me);
            const lockedSelf = self && initial.includes(role.id);
            return <label className="check" key={role.id}>
              <input type="checkbox" checked={selected.includes(role.id)} disabled={missing || lockedSelf}
                onChange={() => toggle(role.id)} />
              <span><b>{role.name}</b> <span className="muted">({role.code}, {role.permissions.length} quyền)</span>
                {missing && <span className="muted"> — vượt quyền của bạn</span>}
                {lockedSelf && <span className="muted"> — không thể tự gỡ</span>}</span>
            </label>;
          })}</div>
          <div className="modal-actions">
            <button className="primary" disabled={saving} onClick={submit}>{saving ? "Đang lưu…" : "Lưu"}</button>
            <button onClick={onClose}>Hủy</button>
          </div>
        </section>
      </div>;
    }

    function RolesPage({ me, notify, reloadMe }) {
      const [roles, setRoles] = useState([]);
      const [catalog, setCatalog] = useState([]);
      const [query, setQuery] = useState("");
      const [editor, setEditor] = useState(undefined);
      const [loading, setLoading] = useState(false);
      const handleError = useToastError(notify);
      const fetchRoles = useCallback(async () => {
        setLoading(true);
        try {
          const params = { page: 1, limit: 100, sort: "name" };
          if (query.trim()) params.q = query.trim();
          const [roleResponse, permissionsResponse] = await Promise.all([
            api.get("/roles", { params }), api.get("/permissions"),
          ]);
          setRoles(roleResponse.data.data);
          setCatalog(permissionsResponse.data.data);
        } catch (error) {
          await handleError(error);
        } finally {
          setLoading(false);
        }
      }, [query, handleError]);
      useEffect(() => {
        const timer = setTimeout(fetchRoles, 250);
        return () => clearTimeout(timer);
      }, [fetchRoles]);
      const removeRole = async (role) => {
        if (!window.confirm(`Xóa vai trò "${role.name}"?`)) return;
        try {
          await api.delete(`/roles/${role.id}`);
          notify("success", "Đã xóa vai trò.");
          await fetchRoles();
        } catch (error) { await handleError(error); }
      };
      return <div>
        <h2>Vai trò</h2>
        <div className="toolbar">
          <input className="search" placeholder="Tìm theo tên hoặc mã vai trò…" value={query}
            onChange={(event) => setQuery(event.target.value)} aria-label="Tìm vai trò" />
          {can(me, "roles:create") && <button className="primary" onClick={() => setEditor(null)}>+ Thêm vai trò</button>}
        </div>
        {loading ? <div className="loading">Đang tải vai trò…</div> : <div className="table-wrap">
          <table><thead><tr><th>Mã</th><th>Tên vai trò</th><th>Quyền</th><th>Người dùng</th><th>Loại</th><th>Thao tác</th></tr></thead>
            <tbody>{roles.length === 0 ? <tr><td colSpan="6" className="empty">Không có vai trò</td></tr> :
              roles.map((role) => <tr key={role.id}>
                <td>{role.code}</td><td>{role.name}<div className="muted">{role.description}</div></td>
                <td><div className="permission-list">{role.permissions.map((permission) => <span key={permission} className="badge">{permission}</span>)}</div></td>
                <td>{role.userCount}</td><td><span className={`badge ${role.isSystem ? "system" : ""}`}>{role.isSystem ? "Hệ thống" : "Tùy chỉnh"}</span></td>
                <td className="actions">
                  {can(me, "roles:update") && <button onClick={() => setEditor(role)}>Sửa</button>}
                  {can(me, "roles:delete") && !role.isSystem && <button className="danger" onClick={() => removeRole(role)}>Xóa</button>}
                </td>
              </tr>)}
            </tbody>
          </table>
        </div>}
        {editor !== undefined && <RoleModal role={editor} catalog={catalog} me={me} notify={notify}
          reloadMe={reloadMe} onClose={() => setEditor(undefined)} onSaved={async () => {
            setEditor(undefined); await fetchRoles(); await reloadMe();
          }} />}
      </div>;
    }

    function RoleModal({ role, catalog, me, notify, reloadMe, onClose, onSaved }) {
      const isNew = !role;
      const [code, setCode] = useState(role?.code || "");
      const [name, setName] = useState(role?.name || "");
      const [description, setDescription] = useState(role?.description || "");
      const [permissions, setPermissions] = useState(role?.permissions || []);
      const [errors, setErrors] = useState({});
      const [saving, setSaving] = useState(false);
      const groups = catalog.reduce((accumulator, permission) => ({
        ...accumulator,
        [permission.resource]: [...(accumulator[permission.resource] || []), permission],
      }), {});
      const toggle = (permission) => setPermissions((current) => current.includes(permission)
        ? current.filter((value) => value !== permission) : [...current, permission]);
      const submit = async (event) => {
        event.preventDefault();
        const validation = {};
        if (isNew && !/^[a-z][a-z0-9-]{2,49}$/.test(code.trim())) validation.code = "Mã không đúng định dạng.";
        if (name.trim().length < 2 || name.trim().length > 100) validation.name = "Tên phải dài từ 2 đến 100 ký tự.";
        setErrors(validation);
        if (Object.keys(validation).length) return;
        setSaving(true);
        try {
          if (isNew) {
            await api.post("/roles", { code: code.trim(), name: name.trim(), description: description.trim() || null, permissions });
          } else {
            if (name.trim() !== role.name || (description.trim() || null) !== role.description) {
              await api.patch(`/roles/${role.id}`, { name: name.trim(), description: description.trim() || null });
            }
            const changed = permissions.length !== role.permissions.length || permissions.some((item) => !role.permissions.includes(item));
            if (!role.isSystem && changed) await api.put(`/roles/${role.id}/permissions`, { permissions });
          }
          notify("success", isNew ? "Tạo vai trò thành công." : "Cập nhật vai trò thành công.");
          await onSaved();
        } catch (error) {
          const fieldErrors = {};
          (error.details || []).forEach((item) => { if (item.field) fieldErrors[item.field] = item.message; });
          if (error.code === "ROLE_CODE_EXISTS") fieldErrors.code = error.message;
          setErrors(fieldErrors);
          if (!Object.keys(fieldErrors).length) {
            notify("error", errorText(error));
            if (error.status === 403) {
            }
          }
        } finally {
          setSaving(false);
        }
      };
      return <div className="modal-backdrop" onMouseDown={(event) => event.target === event.currentTarget && onClose()}>
        <section className="modal" role="dialog" aria-modal="true" aria-labelledby="role-modal-title">
          <h2 id="role-modal-title">{isNew ? "Thêm vai trò" : "Sửa vai trò"}</h2>
          <form onSubmit={submit}>
            {isNew && <><label>Mã vai trò *</label><input value={code} onChange={(event) => setCode(event.target.value)} />
              <span className="field-error">{errors.code}</span></>}
            {!isNew && <p className="muted">Mã vai trò: {role.code}</p>}
            <label>Tên vai trò *</label><input value={name} onChange={(event) => setName(event.target.value)} />
            <span className="field-error">{errors.name}</span>
            <label>Mô tả</label><textarea rows="2" value={description} onChange={(event) => setDescription(event.target.value)} />
            <div className="checks">{Object.entries(groups).map(([resource, entries]) => <div key={resource}>
              <div className="resource-heading">{resource}</div>
              {entries.map((permission) => {
                const disabled = role?.isSystem || !me.permissions.includes(permission.code);
                return <label className="check" key={permission.code}>
                  <input type="checkbox" checked={permissions.includes(permission.code)} disabled={disabled}
                    onChange={() => toggle(permission.code)} />
                  <span><b>{permission.code}</b><span className="muted"> — {permission.description}</span>
                    {disabled && !role?.isSystem && <span className="muted"> (bạn không có quyền này)</span>}</span>
                </label>;
              })}
            </div>)}</div>
            <div className="modal-actions">
              <button className="primary" type="submit" disabled={saving}>{saving ? "Đang lưu…" : "Lưu"}</button>
              <button type="button" onClick={onClose}>Hủy</button>
            </div>
          </form>
        </section>
      </div>;
    }

    function MyProfile({ me }) {
      return <div>
        <h2>Hồ sơ của tôi</h2>
        <div className="profile-grid">
          <div className="profile-item"><strong>Họ tên</strong>{me.fullName}</div>
          <div className="profile-item"><strong>Email</strong>{me.email}</div>
          <div className="profile-item"><strong>Số điện thoại</strong>{me.phone || "Chưa cập nhật"}</div>
          <div className="profile-item"><strong>Trạng thái</strong>{me.status === "active" ? "Hoạt động" : me.status}</div>
          <div className="profile-item"><strong>Vai trò</strong>{me.roles.length
            ? me.roles.map((role) => <span className="badge" key={role.id}>{role.name}</span>)
            : "Chưa được gán vai trò"}</div>
          <div className="profile-item"><strong>Quyền hiệu lực</strong>
            {me.permissions.length ? <div className="permission-list">{me.permissions.map((permission) =>
              <span className="badge" key={permission}>{permission}</span>)}</div> : "Không có quyền quản trị"}
          </div>
        </div>
      </div>;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
